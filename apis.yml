name: Xiaopangxiong
description: >-
  Xiaopangxiong (小胖熊, "small fat bear") is a Chinese B2B e-commerce platform
  for home and office renovation materials, operated by Shanghai Miju Network
  Technology Co., Ltd. (上海米居网络科技有限公司). The platform connects building-material
  suppliers with renovation contractors, crew foremen, and decoration
  companies, selling the full range of auxiliary materials (辅材) — sand,
  cement, paint and coatings, electrical wiring, pipes, tiles, and leveling
  supplies — through a self-operated model that spans factory-direct
  procurement, warehousing, logistics, delivery, installation, and after-sales
  service. Headquartered in Shanghai with service stations and warehouses in
  Suzhou, Hangzhou, Hefei, Ningbo, Wuxi, and Jiaxing, Xiaopangxiong is backed
  by SoftBank Vision Fund 2 and distributes primarily through its 小胖熊 mobile
  app; the company publishes no public developer portal or API surface.
